<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Emerald – Menu Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fdfbe3; --surface:#f6f3d2; --ink:#2f4a22; --muted:#5f7552; --line:#9bb089; --accent:#4b6b34; --on-accent:#fdfbe3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#131a10; --surface:#1b2417; --ink:#e8efd6; --muted:#a3b590; --line:#4a5e3b; --accent:#9cc27a; --on-accent:#131a10; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#131a10; --surface:#1b2417; --ink:#e8efd6; --muted:#a3b590; --line:#4a5e3b; --accent:#9cc27a; --on-accent:#131a10; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 110px}
header h1{font:italic 600 clamp(52px,10vw,92px)/.95 "Cormorant Garamond",Georgia,serif;margin:0;color:var(--accent);letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);font-weight:500}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 6px}
nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
nav a:hover,nav a:focus-visible{background:var(--accent);color:var(--on-accent);outline:none}
.layout{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:start}
section{margin-top:26px}
h2{font:italic 600 38px/1 "Cormorant Garamond",Georgia,serif;margin:0 0 10px;color:var(--accent)}
.box{border:2px solid var(--line);border-radius:4px;padding:4px 18px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:.02em}
.item small{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:2px;max-width:46ch}
.price{font-weight:700;text-align:right}
.step{display:flex;align-items:center;gap:8px;justify-content:flex-end}
button{font:inherit;cursor:pointer;color:inherit}
.step button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:18px;line-height:1;font-weight:600}
.step button:hover,.step button:focus-visible{background:var(--accent);color:var(--on-accent);outline:none}
.step output{min-width:20px;text-align:center;font-weight:600}
aside{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.receipt{background:var(--surface);border:2px solid var(--line);border-radius:4px;padding:18px}
.receipt h2{font-size:32px}
.lines{list-style:none;margin:0 0 12px;padding:0;font-size:14px}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.empty{color:var(--muted);font-size:14px;margin:0 0 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.row label{color:var(--muted);font-size:14px}
.row input[type=number]{width:72px;font:inherit;padding:5px 8px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);text-align:right}
.tips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.tips button{flex:1;padding:6px 0;border:1.5px solid var(--line);border-radius:4px;background:transparent;font-size:14px;font-weight:500}
.tips button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.total{border-top:2px solid var(--ink);margin-top:10px;padding-top:10px;font-size:22px;font-weight:700}
.each{color:var(--muted);font-size:14px;text-align:right;min-height:21px}
.clear{margin-top:12px;width:100%;padding:10px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;font-weight:600}
.clear:hover,.clear:focus-visible{background:var(--accent);color:var(--on-accent);outline:none}
.bar{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{position:static}
  .bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;justify-content:space-between;align-items:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Emerald</h1>
    <p>Tap + to build an order and see your total.</p>
  </header>
  <nav id="nav"></nav>
  <div class="layout">
    <main id="menu"></main>
    <aside id="summary">
      <div class="receipt">
        <h2>Your order</h2>
        <p class="empty" id="empty">Nothing added yet.</p>
        <ul class="lines" id="lines"></ul>
        <div class="row"><span>Subtotal</span><b id="sub">$0.00</b></div>
        <div class="row"><label for="split">Split between</label><input id="split" type="number" min="1" max="50" step="1" value="1"></div>
        <div class="row total"><span>Total</span><span id="total">$0.00</span></div>
        <div class="each" id="each"></div>
        <button class="clear" id="clear" type="button">Clear order</button>
      </div>
    </aside>
  </div>
</div>
<a class="bar" href="#summary"><span id="barCount">0 items</span><span id="barTotal">$0.00</span></a>

<script>
const MENU=[
{n:"Limited Edition",i:[
["Seared King Scallops","Cauliflower purée, brown butter, toasted hazelnuts, herb oil",60],
["Osso Buco alla Milanese","Braised veal shank, saffron risotto, gremolata, red wine jus",90],
["Dark Chocolate & Black Cherry Mousse","Cherry compote, chocolate biscuit, edible gold leaf",45],
["Midnight Veil Cocktail","Gin, blackberry liqueur, elderflower, lemon, sparkling champagne",55]]},
{n:"Appetizer",i:[
["Rosemary Focaccia","Italian flatbread with fresh rosemary and coarse sea salt",45],
["Calamares","Crispy squid, sea salt, white pepper, garlic, chilli, garlic aioli",45],
["Caviar Toast","Brioche with butter, crème fraîche and caviar",60]]},
{n:"Entrée",i:[
["Filet Mignon","Tender steak with garlic mashed potatoes and seasonal vegetables",90],
["Duck à l’Orange","Roasted duck breast with orange glaze and vegetables",80],
["Grilled Lobster Tails","Butterflied tails with garlic & herb butter",80],
["Chicken Supreme","Herb roasted chicken breast, creamy potatoes and vegetables",70]]},
{n:"Dessert",i:[
["Sticky Toffee Pudding","Date sponge, warm toffee sauce, vanilla ice cream",45],
["Pink Champagne Cake","Champagne infused cake with whipped vanilla buttercream",45],
["Lemon Meringue Pie","Shortened pastry, lemon curd, meringue, chocolate shavings",45]]},
{n:"Alcoholic",i:[
["Espresso Martini","Espresso, coffee liqueur and vodka",55],
["Aperol Spritz","Aperol, Prosecco and soda water",55],
["White Russian","Vodka, coffee liqueur and cream over ice",55],
["Glass of Red Wine","Marlowe Syrah",35],
["Glass of White Wine","Marlowe Riesling",35],
["Glass of Champagne","Bleuter’d Champagne",40],
["Bottle of Red Wine","Marlowe Syrah",130],
["Bottle of White Wine","Marlowe Riesling",130],
["Bottle of Champagne","Bleuter’d Champagne",150]]},
{n:"Non Alcoholic",i:[
["Cranberry Spritz","Cranberry juice and sparkling water",40],
["Roy Rogers","Cola, grenadine syrup, maraschino cherry",40],
["Elderflower Fizz","Sparkling water and elderflower syrup",40]]}
];
const qty={};
const $=id=>document.getElementById(id);
const money=n=>"$"+n.toFixed(2);
const slug=s=>s.toLowerCase().replace(/[^a-z]+/g,"-");

$("nav").innerHTML=MENU.map(s=>`<a href="#${slug(s.n)}">${s.n}</a>`).join("");
$("menu").innerHTML=MENU.map((s,si)=>`<section id="${slug(s.n)}"><h2>${s.n}</h2><div class="box">`+
 s.i.map((it,ii)=>{const k=si+"-"+ii;return `<div class="item"><div><b>${it[0]}</b><small>${it[1]}</small></div>
 <div><div class="price">${money(it[2])}</div><div class="step"><button type="button" data-k="${k}" data-d="-1" aria-label="Remove one ${it[0]}">−</button><output id="q${k}">0</output><button type="button" data-k="${k}" data-d="1" aria-label="Add one ${it[0]}">+</button></div></div></div>`}).join("")+`</div></section>`).join("");

function find(k){const [a,b]=k.split("-");return MENU[a].i[b]}
function calc(){
  const keys=Object.keys(qty).filter(k=>qty[k]>0);
  let sub=0,count=0;
  $("lines").innerHTML=keys.map(k=>{const it=find(k),q=qty[k];sub+=it[2]*q;count+=q;return `<li><span>${q} × ${it[0]}</span><span>${money(it[2]*q)}</span></li>`}).join("");
  $("empty").style.display=keys.length?"none":"block";
  const total=sub;
  const n=Math.max(1,parseInt($("split").value)||1);
  $("sub").textContent=money(sub);
  $("total").textContent=money(total);$("barTotal").textContent=money(total);
  $("barCount").textContent=count+(count===1?" item":" items");
  $("each").textContent=n>1&&total>0?money(total/n)+" each":"";
}
$("menu").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]");if(!b)return;
  const k=b.dataset.k;qty[k]=Math.max(0,(qty[k]||0)+ +b.dataset.d);
  $("q"+k).textContent=qty[k];calc();
});
$("split").addEventListener("input",calc);
$("clear").addEventListener("click",()=>{Object.keys(qty).forEach(k=>{qty[k]=0;$("q"+k).textContent=0});calc()});
calc();
</script>
</body>
</html>
