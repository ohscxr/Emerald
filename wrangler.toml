name = "bar-tabs"
main = "worker.js"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "BAR"
class_name = "BarRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BarRoom"]

# Image uploads use a FiveManage API token stored as a secret (never put it here):
#   wrangler secret put FIVEMANAGE_API_KEY
[vars]
# Comma-separated list of site origins allowed to request upload URLs.
# Leave empty to allow any origin. Example:
# ALLOWED_ORIGINS = "https://your-site.pages.dev,https://yourdomain.com"
ALLOWED_ORIGINS = ""

# Discord "who's online" embed uses a webhook URL stored as a secret:
#   wrangler secret put DISCORD_WEBHOOK_URL
# (Discord: Channel settings > Integrations > Webhooks > New Webhook > Copy URL)
